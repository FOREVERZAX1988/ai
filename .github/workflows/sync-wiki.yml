name: Sync GitHub Wiki

on:
  push:
    branches: [main]
    paths:
      - 'docs/wiki/**'
      - 'scripts/sync_github_wiki.sh'
      - 'scripts/wiki_token_check.sh'
      - '.github/workflows/sync-wiki.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-wiki:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main repo (wiki source)
        uses: actions/checkout@v4
        with:
          path: src

      - name: Validate WIKI_SYNC_TOKEN
        id: tok
        env:
          WIKI_SYNC_TOKEN: ${{ secrets.WIKI_SYNC_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          if [[ -z "${WIKI_SYNC_TOKEN}" ]]; then
            echo "::warning::未配置 WIKI_SYNC_TOKEN，跳过 Wiki git 同步。"
            echo "skip=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          bash src/scripts/wiki_token_check.sh "${WIKI_SYNC_TOKEN}" "${GITHUB_REPOSITORY}"
          echo "skip=false" >> "${GITHUB_OUTPUT}"

      - name: Push docs/wiki to GitHub Wiki git
        if: steps.tok.outputs.skip != 'true'
        env:
          WIKI_SYNC_TOKEN: ${{ secrets.WIKI_SYNC_TOKEN }}
          GITHUB_ACTOR: ${{ github.repository_owner }}
          WIKI_SLUG: ${{ github.repository_owner }}/${{ github.event.repository.name }}.wiki
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          COMMIT_MSG="docs: sync wiki from ${COMMIT_SHA}"
          SRC="${GITHUB_WORKSPACE}/src/docs/wiki"
          REMOTE_X="https://x-access-token:${WIKI_SYNC_TOKEN}@github.com/${WIKI_SLUG}.git"
          REMOTE_USER="https://${GITHUB_ACTOR}:${WIKI_SYNC_TOKEN}@github.com/${WIKI_SLUG}.git"
          WORK="$(mktemp -d)"
          trap 'rm -rf "$WORK"' EXIT

          cloned=false
          ACTIVE_REMOTE=""
          for REMOTE in "$REMOTE_X" "$REMOTE_USER"; do
            if git clone --depth 1 --branch master "$REMOTE" "$WORK/repo" 2>/dev/null; then
              cloned=true
              ACTIVE_REMOTE="$REMOTE"
              break
            fi
            if git clone --depth 1 --branch main "$REMOTE" "$WORK/repo" 2>/dev/null; then
              cloned=true
              ACTIVE_REMOTE="$REMOTE"
              break
            fi
          done

          if [[ "$cloned" != true ]]; then
            echo "Wiki git clone failed; initializing empty repo"
            mkdir -p "$WORK/repo"
            cd "$WORK/repo"
            git init -b master
            ACTIVE_REMOTE="$REMOTE_X"
            git remote add origin "$ACTIVE_REMOTE"
          fi

          cd "$WORK/repo"
          git remote set-url origin "$ACTIVE_REMOTE"

          cp "$SRC"/*.md .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --staged --quiet; then
            echo "Wiki already up to date."
            exit 0
          fi

          git commit -m "${COMMIT_MSG}"
          BRANCH="$(git branch --show-current)"
          if ! git push -u origin "${BRANCH}"; then
            git branch -M master
            git push -u origin master
          fi
          echo "Wiki pushed successfully."
