name: Sync GitHub Wiki

# 需要仓库 Secret WIKI_SYNC_TOKEN（classic PAT，repo 权限）。
# 勿在 job if 里引用 secrets（会导致 workflow 秒失败）。
on:
  push:
    branches: [main]
    paths:
      - 'docs/wiki/**'
      - 'scripts/sync_github_wiki.sh'
      - '.github/workflows/sync-wiki.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-wiki:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main repo (wiki source)
        uses: actions/checkout@v4
        with:
          path: src

      - name: Push docs/wiki to GitHub Wiki git
        env:
          WIKI_SYNC_TOKEN: ${{ secrets.WIKI_SYNC_TOKEN }}
          WIKI_SLUG: ${{ github.repository_owner }}/${{ github.event.repository.name }}.wiki
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ -z "${WIKI_SYNC_TOKEN}" ]]; then
            echo "::warning::未配置 WIKI_SYNC_TOKEN，跳过 Wiki git 同步。"
            echo "::notice::文档见 https://github.com/mouxangithub/ai/tree/main/docs/wiki"
            echo "::notice::或 GitHub Pages workflow「Deploy Wiki Docs」"
            exit 0
          fi

          GH_TOKEN="${WIKI_SYNC_TOKEN}"
          COMMIT_MSG="docs: sync wiki from ${COMMIT_SHA}"

          SRC="${GITHUB_WORKSPACE}/src/docs/wiki"
          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${WIKI_SLUG}.git"
          WORK="$(mktemp -d)"
          trap 'rm -rf "$WORK"' EXIT

          echo "Wiki remote: https://github.com/${WIKI_SLUG}.git"

          if git clone --depth 1 --branch master "$REMOTE" "$WORK/repo" 2>/dev/null; then
            echo "Cloned existing wiki (master)"
          elif git clone --depth 1 --branch main "$REMOTE" "$WORK/repo" 2>/dev/null; then
            echo "Cloned existing wiki (main)"
          else
            echo "Wiki git empty; initializing first push"
            mkdir -p "$WORK/repo"
            cd "$WORK/repo"
            git init -b master
            git remote add origin "$REMOTE"
          fi

          cd "$WORK/repo"
          git remote set-url origin "$REMOTE"

          cp "$SRC"/*.md .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --staged --quiet; then
            echo "Wiki already up to date."
            exit 0
          fi

          git commit -m "${COMMIT_MSG}"
          BRANCH="$(git branch --show-current)"
          git push -u origin "${BRANCH}" || git push -u origin master
          echo "Wiki pushed successfully."
