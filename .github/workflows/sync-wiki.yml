name: Sync GitHub Wiki

on:
  push:
    branches: [main]
    paths:
      - 'docs/wiki/**'
      - 'scripts/sync_github_wiki.sh'
      - '.github/workflows/sync-wiki.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-wiki:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main repo (wiki source)
        uses: actions/checkout@v4
        with:
          path: src

      - name: Checkout GitHub Wiki git repo
        id: wiki_checkout
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/${{ github.event.repository.name }}.wiki
          token: ${{ secrets.WIKI_SYNC_TOKEN || secrets.GITHUB_TOKEN }}
          path: wiki-repo

      - name: Init wiki git repo (first-time)
        if: steps.wiki_checkout.outcome != 'success'
        env:
          GH_TOKEN: ${{ secrets.WIKI_SYNC_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p wiki-repo
          cd wiki-repo
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp ../src/docs/wiki/*.md .
          git add -A
          git commit -m "docs: initial wiki from docs/wiki"
          git branch -M master
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository_owner }}/${{ github.event.repository.name }}.wiki.git"
          git push -u origin master

      - name: Sync docs/wiki into wiki repo
        if: steps.wiki_checkout.outcome == 'success'
        run: |
          set -euo pipefail
          cp src/docs/wiki/*.md wiki-repo/
          cd wiki-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "Wiki already up to date."
            exit 0
          fi
          git commit -m "docs: sync wiki from ${{ github.sha }}"
          git push
